# Arquivo local e ignorado pelo Git. Use application-secrets-example.properties como modelo.
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/findb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

management.health.mail.enabled=false

# Set JWT_SECRET to a random value of at least 32 characters before starting the API.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.password-reset.expose-debug-token=${PASSWORD_RESET_EXPOSE_DEBUG_TOKEN:false}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
